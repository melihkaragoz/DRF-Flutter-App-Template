services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-rose_db}
      POSTGRES_USER: ${DB_USER:-rose_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rose_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rose_user} -d ${DB_NAME:-rose_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/rose:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=${DB_NAME:-rose_db}
      - DB_USER=${DB_USER:-rose_user}
      - DB_PASSWORD=${DB_PASSWORD:-rose_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
